name: Validate Codex marketplace

on:
  push:
    branches: [Codex]
  pull_request:
    branches: [Codex]

permissions:
  contents: read

jobs:
  jig:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Validate native marketplace sources
        run: node scripts/check-codex-marketplace.js
      - name: Test marketplace validation
        run: node --test scripts/check-codex-marketplace.test.js
      - name: Test Jig
        working-directory: plugins/jig
        run: npm test
